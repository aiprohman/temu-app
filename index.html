<style>
:root{--ink:#561835;--sub:#85706f;--paper:#f7f2ea;--card:#fff;--rose:#7d2a4c;--rose-l:#f0e1e3;--sage:#4f7a63;--sage-l:#e3efe8;--gold:#a97a22;--gold-l:#f6ecd5;--line:#e4d9cb;--red-l:#fbe4e4;--red:#b3342f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#e8dfd2;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
.serif,h1,h2,.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.25rem;font-weight:600}h1 small{display:block;font:600 .72rem -apple-system,sans-serif;color:var(--sub)}
#badge{font-size:.72rem;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff}
h2{font-size:1.05rem;font-weight:600;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font:600 .78rem -apple-system,sans-serif;color:var(--rose);cursor:pointer}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;margin-top:4px}
.hero .big{font-size:3.6rem;line-height:1;font-weight:500}.hero p{opacity:.8;font-size:.85rem;margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 4px}.hero .bar{background:#ffffff30}
.bar i{display:block;height:100%;background:var(--rose);border-radius:9px}.hero .bar i{background:#f0b8c4}.bar i.over{background:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.tile b{display:block;font:600 1.3rem Georgia,serif}.tile span{font-size:.78rem;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;font:600 .8rem inherit;cursor:pointer}
.tabs button.on,.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.card.late{border-left:4px solid var(--red)}
.bd{flex:1;min-width:0;cursor:pointer}.bd b{display:block;font-weight:600;font-size:.92rem}.bd b.dn{text-decoration:line-through;opacity:.5}
.bd span,.bd em{display:block;font-size:.78rem;color:var(--sub);font-style:normal}.bd em.warn{color:var(--red);font-weight:600}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;color:#fff;font-weight:700;cursor:pointer}.ck.on{background:var(--sage);border-color:var(--sage)}
select.pill{flex:none;border:0;border-radius:99px;padding:6px 8px;font:600 .72rem inherit;max-width:104px;appearance:none;-webkit-appearance:none;text-align:center}
.st-green{background:var(--sage-l);color:var(--sage)}.st-yellow{background:var(--gold-l);color:var(--gold)}.st-red{background:var(--red-l);color:var(--red)}.st-gray{background:#eee;color:#666}
.ib{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.72rem;font-weight:700;color:var(--sage)}
.gh{font:600 .78rem inherit;color:var(--sub);margin:12px 2px 6px;display:flex;justify-content:space-between}
.cal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ch button{border:0;background:var(--rose-l);color:var(--rose);border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.cw{font-size:.68rem;color:var(--sub)}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;border-radius:12px;cursor:pointer;position:relative}
.cd.today{outline:1.5px solid var(--ink)}.cd.sel{background:var(--ink);color:#fff}.cd.wed{background:var(--rose);color:#fff}
.cd i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--rose)}.cd.sel i,.cd.wed i{background:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:1.8rem;box-shadow:0 8px 20px #7d2a4c55;cursor:pointer;z-index:25}
nav{position:fixed;bottom:0;left:0;right:0;z-index:24;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:520px}nav button{flex:1;border:0;background:none;padding:8px 2px;font:600 .72rem inherit;color:var(--sub);cursor:pointer;border-radius:12px}
nav button.on{color:var(--rose);background:var(--rose-l)}
.sheet{position:fixed;inset:0;background:#561835aa;display:none;align-items:flex-end;justify-content:center;z-index:40}.sheet.open{display:flex}
.sh{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h3{font:600 1.1rem Georgia,serif;margin-bottom:12px}
label{display:block;font-size:.75rem;font-weight:600;color:var(--sub);margin:10px 0 4px}
input,select.f,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:16px inherit;background:#fff;color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px;border-radius:12px;border:0;font:700 .9rem inherit;cursor:pointer;background:var(--ink);color:#fff}
.btns .x{background:var(--red-l);color:var(--red);flex:none;padding:13px 16px}.btns .c{background:#eee;color:var(--ink)}
.lk2{display:inline-block;margin:6px 6px 0 0;padding:4px 11px;border-radius:99px;background:var(--rose-l);color:var(--rose);font:600 .72rem inherit;text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:28px 10px;border:1px dashed var(--line);border-radius:14px;font-size:.88rem}
#auth{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.ac{width:100%;max-width:380px;text-align:center}.ac input{margin-top:8px;text-align:left}.nt{color:var(--sub);font-size:.85rem;margin:6px 0 16px}.er{color:var(--red);font-size:.8rem;min-height:1.2em;margin-top:6px}
.lk{display:block;text-align:center;margin-top:16px;color:var(--rose);font-weight:600;font-size:.85rem;cursor:pointer}.ac h3{font:600 1.05rem Georgia,serif;margin:18px 0 4px;text-align:left}
.gear{border:1px solid var(--line);background:#fff;border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer;color:var(--ink)}
#intro{position:fixed;inset:0;z-index:90;background:#ebe5dc;display:flex;align-items:center;justify-content:center;transition:opacity .6s}#intro.out{opacity:0;pointer-events:none}
#ivw{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent),linear-gradient(transparent,#000 20%,#000 80%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent),linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#iv{width:100%;max-height:100%;object-fit:contain}@media(max-aspect-ratio:1/1){#iv{transform:scale(2.1)}}
#intro button{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));border:1px solid #561835;background:transparent;color:#561835;border-radius:99px;padding:8px 20px;font:600 .8rem inherit;cursor:pointer}#intro #snd{right:20px;padding:8px 14px}#intro #skip{left:20px}
